<!DOCTYPE html>
<html lang="en">
<head>
    <title>jQuery Task</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 id="heading">Welcome to jQuery!</h2>
    <p class="text">This is my first jQuery task.</p>

    <button id="hide" class="btn btn-danger">Hide</button>
    <button id="show" class="btn btn-success">Show</button>
    <button id="toggle" class="btn btn-primary">Toggle</button>
    <button id="color" class="btn btn-warning">Change Color</button>
    <button id="alert" class="btn btn-dark">Alert</button>

    <script>
        $(document).ready(function () {

            $("#hide").click(function () {
                $("p").hide();
            });

            $("#show").click(function () {
                $("p").show();
            });

            $("#toggle").click(function () {
                $("p").toggle();
            });

            // $("#color").click(function () {
            //     $(".btn").css("background-color", "red");
            // });

            $("#color").click(function () {
            $(".btn").css("background-color", "red");
            });

            $("#alert").click(function () {
                alert("Button clicked successfully!");
            });

            $(".text").css("color", "blue");

        });
    </script>

</body>
</html>
